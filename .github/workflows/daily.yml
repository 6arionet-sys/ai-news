name: Daily AI News Update

on:
  schedule:
    # 毎日 UTC 20:30 (日本時間 5:30) に自動実行
    - cron: '30 20 * * *'
  workflow_dispatch: # GitHubのActions画面からボタン1つで手動実行可能

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate icons if missing
        run: python scripts/make_icons.py

      - name: Build daily news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(auto): update daily news [skip ci]"
            git push
          fi
